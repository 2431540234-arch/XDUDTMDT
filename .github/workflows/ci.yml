name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurelia
          POSTGRES_PASSWORD: aurelia
          POSTGRES_DB: aurelia_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aurelia -d aurelia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aurelia:aurelia@localhost:5433/aurelia_test?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Khởi động MinIO (ảnh Bitnami, ghim bản 2025-04-22)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=aurelia -e MINIO_ROOT_PASSWORD=aurelia123 \
            bitnamilegacy/minio:2025.4.22-debian-12-r2
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && break; sleep 2; done
      - name: Khởi động Mailpit (SMTP 1025, API 8025)
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit
          for i in $(seq 1 30); do curl -fsS http://localhost:8025/livez && break; sleep 2; done
      - name: Prisma Client
        run: npx -w @aurelia-living/api prisma generate
      - name: Kiểm tra shared-types đồng bộ với schema.prisma
        run: npm run types:check
      - name: Build shared-types
        run: npm run build:types
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Test web (Vitest)
        run: npm test -w @aurelia-living/web
      - name: Unit test
        run: npm run test
      - name: Cài trình duyệt cho Playwright (đúng phiên bản của apps/web)
        run: npx -w @aurelia-living/web playwright install --with-deps chromium
      - name: E2E test (PostgreSQL service + Playwright)
        run: npm run test:e2e
      - name: Build (shared-types, api, web)
        run: npm run build
