name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurelia
          POSTGRES_PASSWORD: aurelia
          POSTGRES_DB: aurelia_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aurelia -d aurelia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aurelia:aurelia@localhost:5433/aurelia_test?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma Client
        run: npx -w @aurelia-living/api prisma generate
      - name: Kiểm tra shared-types đồng bộ với schema.prisma
        run: npm run types:check
      - name: Build shared-types
        run: npm run build:types
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit test
        run: npm run test
      - name: E2E test (PostgreSQL service)
        run: npm run test:e2e
      - name: Build (shared-types, api, web)
        run: npm run build
